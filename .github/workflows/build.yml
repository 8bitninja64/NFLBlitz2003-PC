# Builds the runtime (no game code: the game module is compiled from each player's own disc) on
# Windows and Linux and packages each (zip / tar.xz); tags v* publish both as a release.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# The version the F1 menu's updater compares with the latest release: the tag for releases.
env:
  BLITZ_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Build runtime
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tools/build.ps1 -SkipRecomp -Target blitz
      - name: Package
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tools/package.ps1 -Zip
      - uses: actions/upload-artifact@v5
        with:
          name: NFLBlitz2003-windows-x64
          path: dist/NFLBlitz2003-windows-x64.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NFLBlitz2003-windows-x64.zip

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      # The build directory is cached (Dawn's sources and objects, ~25 of the ~30 minutes): keyed on
      # Aurora's commit and the build recipe, so a new cache is made only when those change; any older
      # one is a starting point (ninja rebuilds what changed).
      - name: Build cache key
        id: key
        run: |
          echo "aurora=$(git -C extern/aurora rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Restore the build directory
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-release
          key: linux-release-${{ steps.key.outputs.aurora }}-${{ hashFiles('tools/build_linux_release.sh', 'patches/aurora/*.patch') }}
          restore-keys: linux-release-
      # In Ubuntu 22.04 (glibc 2.35), so that the release runs on Ubuntu 22.04 / Mint 21 / Debian 12 and
      # newer; clang 18, Dawn and SDL3 from source (tools/build_linux_release.sh).
      - name: Build runtime (Ubuntu 22.04 container)
        run: |
          mkdir -p build/linux-release
          docker run --rm -e BLITZ_VERSION -v "$PWD:/src" -v "$PWD/build/linux-release:/build" ubuntu:22.04 \
            sh /src/tools/build_linux_release.sh /src /build
          sudo chown -R "$(id -u):$(id -g)" build extern
      - name: Save the build directory
        if: steps.cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: build/linux-release
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Zig (the first-start compiler the package carries)
        run: |
          curl -fsSL -o zig.tar.xz https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz
          echo "1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026  zig.tar.xz" | sha256sum -c
          mkdir -p "$HOME/zig" && tar -C "$HOME/zig" -xJf zig.tar.xz && rm zig.tar.xz
      - name: Package
        run: BLITZ_MAX_GLIBC=2.35 sh tools/package_linux.sh build/linux-release
      - uses: actions/upload-artifact@v5
        with:
          name: NFLBlitz2003-linux-x64
          path: dist/NFLBlitz2003-linux-x64.tar.xz
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NFLBlitz2003-linux-x64.tar.xz
