# Builds the runtime (no game code: the game module is compiled from each player's own disc) on
# Windows and Linux. The Windows job packages the release zip; tags v* publish it as a release.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build runtime
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tools/build.ps1 -SkipRecomp -Target blitz
      - name: Package
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tools/package.ps1 -Zip
      - uses: actions/upload-artifact@v4
        with:
          name: NFLBlitz2003-windows-x64
          path: dist/NFLBlitz2003-windows-x64.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NFLBlitz2003-windows-x64.zip

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang python3 libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxss-dev libxkbcommon-dev libwayland-dev wayland-protocols libegl-dev libgl-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libdrm-dev libgbm-dev libusb-1.0-0-dev
      - name: Build runtime
        run: |
          cmake -S . -B build/linux-clang -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          cmake --build build/linux-clang --target blitz
